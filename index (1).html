<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="Consulta il menù del ristorante Maison.">
  <title>Maison | Il nostro menù</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f5f2ec; color: #282824; padding: 24px; }
    main { width: min(100%, 460px); padding: clamp(32px, 8vw, 56px) 28px; background: #fffdfa; border: 1px solid #e7e2d9; border-radius: 24px; text-align: center; box-shadow: 0 18px 50px rgba(30,30,25,.06); }
    .eyebrow { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: #817c73; margin: 0 0 18px; }
    .logo { display: block; max-width: 190px; max-height: 130px; width: auto; height: auto; margin: 0 auto 20px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(44px, 12vw, 60px); font-weight: 400; letter-spacing: -.055em; margin: 0; }
    .rule { width: 54px; height: 1px; background: #b5a991; margin: 25px auto; }
    p { line-height: 1.6; color: #6b675f; margin: 0 0 30px; }
    a.button { display: block; background: #282824; color: #fff; text-decoration: none; padding: 17px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; }
    a.button:hover, a.button:focus-visible { background: #49463f; }
    small { display: block; margin-top: 20px; color: #89847c; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Ristorante · Pizzeria</p>
    <img class="logo" src="logo.png" alt="Logo Maison" onerror="this.style.display='none'">
    <h1>Maison</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Benvenuti. Scoprite le nostre proposte e scegliete ciò che più vi piace.</p>
    <a class="button" href="menu.pdf" target="_blank" rel="noopener">Visualizza il menù</a>
    <small>Il menù si apre in formato PDF</small>
  </main>
</body>
</html>
